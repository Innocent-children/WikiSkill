[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "WikiSkill"
version = "0.1.0"
description = "Local Codex transcript, knowledge and Skill management with a WebUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "PyYAML>=6.0",
    "uvicorn>=0.30,<1",
]

[project.scripts]
wikiskill = "wikiskill.live.cli:main"
wikiskill-codex = "wikiskill.live.cli:main"

[tool.setuptools.packages.find]
include = ["wikiskill*"]

[tool.setuptools.package-data]
"wikiskill.live" = ["skill/SKILL.md", "web_assets/*", "web_assets/assets/*"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
]
